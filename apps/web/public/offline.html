<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#200910" />
    <title>عدم اتصال به اینترنت | سارا نجفی</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: #200910;
        color: #f7f5fc;
        font-family: Peyda, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { width: min(100%, 420px); }
      img { width: 76px; height: 76px; margin: 0 auto 25px; border-radius: 50%; }
      h1 { margin: 0 0 12px; font-size: 24px; }
      p { margin: 0; color: #aaa6b5; font-size: 14px; line-height: 2; }
      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        padding: 0 20px;
        border: 1px solid #bc9c8f;
        border-radius: 10px;
        color: #f7f5fc;
        font-size: 13px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>اتصال اینترنت در دسترس نیست</h1>
      <p>برای مشاهده‌ی این صفحه دوباره به اینترنت وصل شو و تلاش کن.</p>
      <a href="/">تلاش دوباره</a>
    </main>
  </body>
</html>
